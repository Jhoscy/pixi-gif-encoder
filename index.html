  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script>
    function download(buffer) {
      const url = window.URL
           .createObjectURL(new Blob([buffer]));
                  const link = document.createElement('a');
                  link.href = url;
                  link.setAttribute('download', 'big_smile.gif');
                  document.body.appendChild(link);
                  link.click();
    }
  </script>
  <script>
    function downloadGIF(buffer) {
      console.log('Download', buffer, buffer.length);
      var byteArrays= [];
      for (var offset = 0; offset < buffer.length; offset += 512) {
        let sliceOfBuffer = buffer.slice(offset, offset + 512);
        let byteArray = new Uint8Array(sliceOfBuffer);
        byteArrays.push(byteArray);
      }
      var blob = new Blob(byteArrays, { type: "image/gif"});
      saveAs(blob, "first_big_smile.gif");
    }
  </script>
